name: Update Instagram stats

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Instagram stats
        run: node scripts/update-stats.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IGTOKEN }}

      - name: Commit stats.json
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || (git commit -m "chore: update stats" && git push)
